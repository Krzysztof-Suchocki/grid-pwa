<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Storage API – localStorage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
      background: #f3f5f9;
      color: #1c2b40;
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 440px);
      padding: 28px;
      background: #fff;
      border: 1px solid #dbe1e9;
      border-radius: 12px;
      box-shadow: 0 6px 25px rgba(28,43,64,.07);
    }
    h1 { font-size: 1.6rem; margin: 0 0 16px; }
    p { line-height: 1.5; }
    button {
      font: inherit;
      font-weight: 700;
      background: #2563eb;
      color: white;
      border: 0;
      border-radius: 7px;
      padding: 12px 22px;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button:focus-visible { outline: 3px solid #93c5fd; outline-offset: 2px; }
    #status { min-height: 1.5em; margin-bottom: 0; }
  </style>
</head>
<body>
  <main>
    <h1>Web Storage API</h1>
    <p>Kliknij przycisk, aby zapisać tekst <strong>ala ma kota</strong> w pamięci przeglądarki (localStorage).</p>
    <button id="zapisz" type="button">Zapisz</button>
    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <script>
    const przycisk = document.getElementById('zapisz');
    const status = document.getElementById('status');

    przycisk.addEventListener('click', () => {
      try {
        localStorage.setItem('tekst', 'ala ma kota');
        const zapisanyTekst = localStorage.getItem('tekst');
        status.textContent = 'Zapisano w localStorage: ' + zapisanyTekst;
        console.log('Odczyt z localStorage:', zapisanyTekst);
      } catch (blad) {
        status.textContent = 'Nie udało się zapisać danych w localStorage.';
        console.error('Błąd zapisu:', blad);
      }
    });
  </script>
</body>
</html>
