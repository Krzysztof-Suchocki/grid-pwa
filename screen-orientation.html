<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#172554">
  <title>Zadanie 5 – Screen Orientation API</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: light;
      --bg: #eff6ff;
      --fg: #172554;
      --accent: #2563eb;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--fg);
    }
    main {
      width: min(100%, 550px);
      padding: clamp(20px, 5vw, 36px);
      border: 1px solid var(--border);
      border-radius: 24px;
      background: white;
      box-shadow: 0 12px 36px rgba(15, 23, 42, .09);
      text-align: center;
    }
    h1 { margin: 0 0 8px; font-size: clamp(1.35rem, 4vw, 1.9rem); }
    .intro { color: #475569; line-height: 1.55; margin: 0 0 22px; }
    .visual {
      min-height: 155px;
      display: grid;
      place-items: center;
      margin: 12px 0 20px;
    }
    .phone {
      width: 78px;
      height: 140px;
      border: 7px solid #1e293b;
      border-radius: 17px;
      position: relative;
      background: linear-gradient(140deg, #bfdbfe, #60a5fa);
      transition: transform .3s ease;
    }
    .phone::before {
      content: "";
      position: absolute;
      width: 26px;
      height: 5px;
      border-radius: 10px;
      background: #1e293b;
      top: 3px;
      left: 50%;
      transform: translateX(-50%);
    }
    html[data-orientation="landscape"] .phone { transform: rotate(90deg); }
    .current {
      display: block;
      color: var(--accent);
      font-size: clamp(1.6rem, 7vw, 2.4rem);
      font-weight: 800;
      margin-bottom: 18px;
    }
    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      text-align: left;
      margin: 0;
    }
    .details > div { background: #f1f5f9; padding: 13px; border-radius: 12px; min-width: 0; }
    dt { color: #475569; font-size: .85rem; margin-bottom: 6px; }
    dd { margin: 0; font-weight: 700; overflow-wrap: anywhere; }
    .tip { font-size: .9rem; color: #475569; line-height: 1.5; margin: 22px 0 0; }
    html[data-orientation="landscape"] { --accent: #0f766e; --bg: #ecfdf5; }
    @media (max-width: 370px) { .details { grid-template-columns: 1fr; } }
  </style>
  <script src="./screen-orientation.js" defer></script>
</head>
<body>
  <main>
    <h1>Screen Orientation</h1>
    <p class="intro">Obróć telefon. Strona automatycznie wykryje ustawienie pionowe (portrait) lub poziome (landscape).</p>
    <div class="visual" aria-hidden="true"><div class="phone"></div></div>
    <output id="orientationLabel" class="current" aria-live="polite">Sprawdzanie…</output>
    <dl class="details">
      <div><dt>Typ orientacji</dt><dd id="orientationType">—</dd></div>
      <div><dt>Kąt ekranu</dt><dd id="orientationAngle">—</dd></div>
      <div><dt>Szerokość widoku</dt><dd id="viewportWidth">—</dd></div>
      <div><dt>Wysokość widoku</dt><dd id="viewportHeight">—</dd></div>
      <div><dt>Źródło odczytu</dt><dd id="orientationSource">—</dd></div>
      <div><dt>Zmiany orientacji</dt><dd id="changeCount">0</dd></div>
    </dl>
  </main>
</body>
</html>
