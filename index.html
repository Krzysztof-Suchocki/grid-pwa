<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsywny układ CSS Grid</title>
  <meta name="theme-color" content="#243247">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="stylesheet" href="./style.css">
</head>
  <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker
        .register('./service-worker.js')
        .then(() => {
          console.log('Service Worker zarejestrowany');
        })
        .catch(error => {
          console.error('Błąd Service Workera:', error);
        });
    });
  }
</script>
<body>
  <main class="grid-container" aria-label="Responsywny układ sześciu obszarów">
    <section class="area area-a">a</section>
    <section class="area area-b">b</section>
    <section class="area area-c">c</section>
    <section class="area area-d">d</section>
    <section class="area area-e">e</section>
    <section class="area area-f">f</section>
  </main>
</body>
</html>
