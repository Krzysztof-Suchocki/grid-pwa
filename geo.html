<!doctype html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#15263d">
  <title>Geolokalizacja na żywo – Grid PWA</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100svh; margin: 0; padding: 24px 16px; background: #eef3f8; color: #13223a; }
    main { max-width: 680px; margin: 0 auto; }
    header { margin-bottom: 20px; }
    .back { display: inline-block; color: #31598a; text-decoration: none; margin-bottom: 12px; font-size: .95rem; }
    h1 { margin: 0 0 8px; line-height: 1.2; font-size: clamp(1.6rem, 6vw, 2.3rem); }
    .intro { margin: 0; color: #506278; line-height: 1.5; }
    .panel { background: #fff; padding: 22px; border: 1px solid #dbe4ee; border-radius: 18px; box-shadow: 0 10px 30px #12263d10; }
    .status { display: flex; gap: 10px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; background: #eef3f8; color: #334a66; margin-bottom: 20px; line-height: 1.45; }
    .status::before { content: ''; width: 10px; height: 10px; flex: 0 0 auto; margin-top: 6px; border-radius: 50%; background: #8395aa; }
    .status.active { background: #eaf8ee; color: #12572e; }
    .status.active::before { background: #1b9750; }
    .status.error { background: #fff0ef; color: #a02b2b; }
    .status.error::before { background: #d44949; }
    .coordinates { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .value { background: #f4f7fa; border: 1px solid #e3eaf1; border-radius: 12px; padding: 16px; min-width: 0; }
    .value .name { display: block; color: #566981; font-size: .87rem; margin-bottom: 10px; }
    .value output { display: block; font-size: clamp(1.05rem, 4.2vw, 1.45rem); font-weight: 700; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
    .details { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 20px; margin: 19px 0 22px; }
    .details div { min-width: 0; }
    .details dt { color: #566981; font-size: .84rem; margin-bottom: 4px; }
    .details dd { margin: 0; font-weight: 600; overflow-wrap: anywhere; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; }
    button { flex: 1 1 180px; border: 0; border-radius: 10px; padding: 13px 18px; font: inherit; font-weight: 650; cursor: pointer; touch-action: manipulation; }
    #start { background: #195aa3; color: #fff; }
    #stop { background: #e7edf5; color: #183047; }
    button:disabled { cursor: not-allowed; opacity: .5; }
    button:focus-visible, .back:focus-visible { outline: 3px solid #cf8a0a; outline-offset: 3px; }
    .note { margin: 18px 2px 0; color: #52657c; line-height: 1.55; font-size: .91rem; }
    @media(max-width: 380px) { .coordinates, .details { grid-template-columns: 1fr; } .panel { padding: 16px; } }
  </style>
  <script src="./geo.js" defer></script>
</head>
<body>
  <main>
    <header>
      <a class="back" href="./index.html">← Wróć do Grid PWA</a>
      <h1>Geolokalizacja na żywo</h1>
    </header>
    <section class="panel" aria-label="Odczyt położenia">
      <div id="status" class="status" role="status" aria-live="polite">Kliknij „Rozpocznij”, aby udostępnić lokalizację.</div>
      <div class="coordinates">
        <div class="value"><span class="name">Szerokość geograficzna</span><output id="latitude">—</output></div>
        <div class="value"><span class="name">Długość geograficzna</span><output id="longitude">—</output></div>
      </div>
      <dl class="details">
        <div><dt>Dokładność (szacunkowa)</dt><dd id="accuracy">—</dd></div>
        <div><dt>Ostatnia aktualizacja</dt><dd id="updated">—</dd></div>
      </dl>
      <div class="controls">
        <button id="start" type="button">Rozpocznij lokalizację</button>
        <button id="stop" type="button" disabled>Zatrzymaj</button>
      </div>
    </section>
  </main>
</body>
</html>
